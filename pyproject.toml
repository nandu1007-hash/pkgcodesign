[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgcodesign"
version = "0.1.0"
description = "Open-source framework for system-level package co-design (thermo-mechanical FEM, materials DB, ROMs)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.23", "scipy>=1.10", "h5py>=3.8", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[project.scripts]
pkgcodesign = "pkgcodesign.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pkgcodesign = ["data/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
